    <!-- Preload Hero Brand Logo for instant 0ms rendering without lag -->
    <link rel="preload" as="image" href="/new-logo.webp" type="image/webp" fetchpriority="high" />
    <link rel="preload" as="image" href="/new-logo-dark.webp" type="image/webp" />

    <!-- Instant theme initialization to prevent logo flicker and layout shift -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('d95-theme');
          var theme = (stored === 'light' || stored === 'dark') ? stored : 'dark';
          document.documentElement.setAttribute('data-theme', theme);
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
          } else {
            document.documentElement.classList.add('light');
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FoodEstablishment",
      "name": "D95 Gaming & Café",

    }
    </script>
